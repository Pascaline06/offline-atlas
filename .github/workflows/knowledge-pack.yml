name: Reproducible knowledge pack
on:
  push:
    paths:
      - '.github/workflows/knowledge-pack.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install desktop-only mirror reader
        run: python3 -m pip install pyarrow==18.1.0
      - name: Build documented real-data pack
        run: python3 tools/build_pack.py --output build/knowledge
      - name: Probe development questions with Android ranker
        run: python3 tools/retrieve_passages.py build/knowledge/atlas.db data/eval-unseen-20260929.txt --output build/knowledge/retrieval-development.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-atlas-real-knowledge-pack
          path: |
            build/knowledge/offline-atlas-knowledge.zip*
            build/knowledge/source-inputs.json
            build/knowledge/SHA256SUMS
            build/knowledge/retrieval-development.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish downloadable preparation pack
        if: success() && github.ref == 'refs/heads/codex/offline-atlas-completion'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="knowledge-v5-${GITHUB_RUN_ID}"
          gh release create "$TAG" --target "$GITHUB_SHA" --prerelease --title 'Offline Atlas schema 5 knowledge pack' --notes 'Offline preparation pack. Consult source-inputs.json for corpus scope, snapshot dates, licenses, checksums and reproducible input URLs. This is not evidence of bounty qualification.' build/knowledge/offline-atlas-knowledge.zip* build/knowledge/source-inputs.json build/knowledge/SHA256SUMS
