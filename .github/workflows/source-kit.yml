name: Source build kit
on:
  push:
    paths: ['.github/workflows/source-kit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Prepare source bundle and verified wrapper
        shell: bash
        run: |
          mkdir -p build/source-kit/wrapper
          git bundle create build/source-kit/offline-atlas.bundle --all
          printf "tasks.named('wrapper') { gradleVersion = '8.10.2'; distributionType = Wrapper.DistributionType.BIN }\n" > build/source-kit/wrapper/build.gradle
          printf "rootProject.name = 'wrapper-bootstrap'\n" > build/source-kit/wrapper/settings.gradle
          gradle -p build/source-kit/wrapper wrapper
          curl --fail --location --max-time 60 https://services.gradle.org/distributions/gradle-8.10.2-bin.zip.sha256 > build/source-kit/wrapper/distribution.sha256
          python3 - <<'PY'
          from pathlib import Path
          root=Path('build/source-kit/wrapper')
          checksum=(root/'distribution.sha256').read_text().strip()
          assert len(checksum)==64 and all(c in '0123456789abcdef' for c in checksum)
          properties=root/'gradle/wrapper/gradle-wrapper.properties'
          properties.write_text(properties.read_text()+'distributionSha256Sum='+checksum+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: offline-atlas-source-build-kit
          path: build/source-kit/
          retention-days: 30

