name: Constrained development whole-answer probe
on:
  push:
    paths:
      - '.github/workflows/answer-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download exact preparation pack and provenance
        run: |
          mkdir -p build/knowledge
          gh release download knowledge-v5-37155745133 --dir build/knowledge
          cd build/knowledge
          sha256sum -c SHA256SUMS
          unzip -q offline-atlas-knowledge.zip
          rm offline-atlas-knowledge.zip
          python3 -c 'import hashlib,json,pathlib; m=json.loads(pathlib.Path("source-inputs.json").read_text()); h=hashlib.file_digest(open("atlas.db","rb"),"sha256").hexdigest(); assert h==m["pack"]["sha256"]'
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build pinned desktop engine
        run: |
          git clone --quiet --filter=blob:none https://github.com/ggml-org/llama.cpp.git third_party/llama-probe
          git -C third_party/llama-probe checkout --quiet 2145525a4081d66ff1a87cf43ef809f95a85ac0c
          cmake -S third_party/llama-probe -B build/probe -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DLLAMA_BUILD_TESTS=OFF
          cmake --build build/probe --target llama-app -j 2
      - name: Download pinned model and generate complete development answers
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/model.gguf" 'https://huggingface.co/unsloth/Qwen3-4B-Instruct-2507-GGUF/resolve/main/Qwen3-4B-Instruct-2507-Q4_K_M.gguf'
          printf '%s  %s\n' '3605803b982cb64aead44f6c1b2ae36e3acdb41d8e46c8a94c6533bc4c67e597' "$RUNNER_TEMP/model.gguf" | sha256sum -c -
          python3 tools/answer_probe.py build/knowledge/atlas.db "$RUNNER_TEMP/model.gguf" "$PWD/build/probe/bin/llama" development-answers.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: development-answer-and-provenance-probe
          path: |
            development-answers.jsonl
            build/knowledge/source-inputs.json
            build/knowledge/SHA256SUMS
          if-no-files-found: error
